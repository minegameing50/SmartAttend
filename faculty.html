<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/jpeg" href="static/logo.jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Faculty</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060a14;--panel:#0d1526;--panel2:#0a1020;--border:#162035;--accent:#00e5b4;--accent2:#3d8eff;--warn:#ffb547;--danger:#ff6b6b;--text:#edf2ff;--muted:#5c7499;--muted2:#8ba3c7}
html,body{min-height:100vh}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
nav{position:sticky;top:0;z-index:100;background:rgba(6,10,20,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-brand{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-brand img{width:34px;height:34px;border-radius:8px;background:#111;padding:3px;object-fit:contain}
.btn-out{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:8px;cursor:pointer;font-size:.8rem;text-decoration:none;transition:.2s}
.btn-out:hover{border-color:var(--danger);color:var(--danger)}
.main{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
h1{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;margin-bottom:6px}
.sub{color:var(--muted2);font-size:.875rem;margin-bottom:28px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 22px}
.sl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.sv{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800}
.cg{color:var(--accent)} .cb{color:var(--accent2)} .cy{color:var(--warn)}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-hdr h2{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700}
.badge{background:rgba(0,229,180,.1);color:var(--accent);border:1px solid rgba(0,229,180,.2);border-radius:20px;padding:3px 10px;font-size:.72rem}
.classes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;margin-bottom:36px}

/* CLASS CARD */
.cc{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;transition:border-color .2s;animation:fadeUp .5s ease both}
.cc.active-class{border-color:var(--accent);box-shadow:0 0 20px rgba(0,229,180,.1)}
.ct{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.cn{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700}
.cs{color:var(--muted2);font-size:.8rem;margin-top:3px}
.pp{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;padding:5px 12px;border-radius:8px}
.pp.h{background:rgba(0,229,180,.1);color:var(--accent)}
.pp.m{background:rgba(255,181,71,.1);color:var(--warn)}
.pp.l{background:rgba(255,107,107,.1);color:var(--danger)}

/* CLASS STATUS BADGE */
.class-status{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:20px;margin-bottom:12px}
.class-status.ongoing{background:rgba(0,229,180,.1);color:var(--accent);border:1px solid rgba(0,229,180,.2)}
.class-status.ended{background:rgba(100,100,100,.1);color:var(--muted);border:1px solid var(--border)}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.status-dot.blink{animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.chart-row{display:flex;align-items:center;gap:16px;margin:10px 0}
.cw{width:80px;height:80px;flex-shrink:0}
.leg{display:flex;flex-direction:column;gap:7px}
.li{display:flex;align-items:center;gap:7px;font-size:.8rem}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lv{font-family:'Syne',sans-serif;font-weight:700;min-width:20px}
.ll{color:var(--muted2)}
.ldiv{border-top:1px solid var(--border);padding-top:5px;margin-top:2px;font-size:.72rem;color:var(--muted)}
.pb{height:5px;background:var(--border);border-radius:3px;margin-bottom:14px;overflow:hidden}
.pf{height:100%;border-radius:3px}
.fg{background:linear-gradient(90deg,var(--accent),var(--accent2))} .fy{background:var(--warn)} .fr{background:var(--danger)}

/* ACTION BUTTONS */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.btn-start{padding:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:9px;color:#060a14;font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn-start:hover{opacity:.85}
.btn-end-class{padding:10px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:9px;color:var(--danger);font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;transition:.2s;display:none}
.btn-end-class:hover{background:rgba(255,107,107,.2)}
.btn-qr{padding:10px;background:rgba(61,142,255,.1);border:1px solid rgba(61,142,255,.2);border-radius:9px;color:var(--accent2);font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;transition:.2s;display:none}
.btn-qr:hover{background:rgba(61,142,255,.2)}
.btn-full{grid-column:1/-1}

/* MODALS */
.mo{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);align-items:center;justify-content:center}
.mo.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:32px;max-width:400px;width:92%;text-align:center;animation:fadeUp .3s ease}
.modal h3{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:6px}
.msub{color:var(--muted2);font-size:.83rem;margin-bottom:18px}
.tlabel{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:block}
.topts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.tb{padding:7px 15px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--muted2);cursor:pointer;font-size:.83rem;transition:all .18s}
.tb.sel,.tb:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,229,180,.08)}
.crow{display:flex;align-items:center;gap:7px;justify-content:center;margin-top:9px}
.crow input{width:68px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:.875rem;text-align:center;outline:none}
.crow input:focus{border-color:var(--accent)}
.crow span{color:var(--muted2);font-size:.83rem}
.btn-gen{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:9px;color:#060a14;font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;margin-top:18px;transition:opacity .2s}
.btn-gen:hover{opacity:.88}
.qrd{display:none}
#qr-box{display:flex;justify-content:center;margin-bottom:10px}
#qr-box canvas,#qr-box img{border-radius:10px;border:4px solid white}
.cdw{position:relative;width:76px;height:76px;margin:14px auto 0}
.cdr{transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--border);stroke-width:6}
.rfg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke .4s}
.cdt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cdn{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;line-height:1}
.cds{font-size:.58rem;color:var(--muted);margin-top:2px}
.expb{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:var(--danger);border-radius:8px;padding:9px;font-size:.8rem;margin-top:12px;display:none}
.mbtns{display:flex;gap:9px;margin-top:16px}
.bcl{flex:1;padding:10px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;color:var(--muted);cursor:pointer}
.bcl:hover{border-color:var(--danger);color:var(--danger)}

/* TABLE */
.tbox{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:28px}
.thdr{padding:18px 22px;border-bottom:1px solid var(--border)}
.thdr h2{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700}
.tabs{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:7px;cursor:pointer;font-size:.82rem;border:1px solid var(--border);color:var(--muted2);background:transparent;transition:all .18s}
.tab.active{background:rgba(0,229,180,.1);border-color:rgba(0,229,180,.3);color:var(--accent)}
table{width:100%;border-collapse:collapse}
th{padding:11px 20px;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:12px 20px;font-size:.85rem;border-bottom:1px solid rgba(22,32,53,.5)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.rn{font-family:'Syne',sans-serif;font-size:.78rem;color:var(--accent2)}
.ap{font-family:'Syne',sans-serif;font-weight:700}
.ap.h{color:var(--accent)} .ap.m{color:var(--warn)} .ap.l{color:var(--danger)}
.mb{height:4px;background:var(--border);border-radius:2px;margin-top:4px;width:80px;overflow:hidden}
.mf{height:100%;border-radius:2px}
.es{padding:30px;text-align:center;color:var(--muted);font-size:.85rem}
.lov{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="lov" id="lov"><div class="spin"></div></div>
<nav>
  <div class="nav-brand"><img src="static/logo.jpeg">SmartAttend</div>
  <div style="display:flex;align-items:center;gap:14px">
    <span style="color:var(--muted2);font-size:.875rem" id="nav-name"></span>
    <a href="login.html" class="btn-out" id="lout">Sign Out</a>
  </div>
</nav>
<div class="main">
  <h1>Faculty Dashboard</h1>
  <p class="sub" id="dsub">Loading your classes…</p>
  <div class="stats-row">
    <div class="stat-card"><div class="sl">My Classes</div><div class="sv cb" id="sc">—</div></div>
    <div class="stat-card"><div class="sl">Total Students</div><div class="sv cg" id="ss">—</div></div>
    <div class="stat-card"><div class="sl">Avg Attendance</div><div class="sv cy" id="sa">—</div></div>
  </div>
  <div class="sec-hdr">
    <h2>Your Classes</h2>
    <span class="badge" id="cc-badge">0 classes</span>
  </div>
  <div class="classes-grid" id="cg"><div class="es">Loading classes…</div></div>
  <div class="tbox">
    <div class="thdr"><h2>Student Attendance Details</h2><div class="tabs" id="tabs"></div></div>
    <div id="tbd"></div>
  </div>
</div>

<!-- QR MODAL -->
<div class="mo" id="qr-mo">
  <div class="modal">
    <h3 id="qr-title">Generate QR</h3>
    <p class="msub" id="qr-sub">Set how long students can scan</p>
    <div id="ts">
      <span class="tlabel">QR Valid Duration</span>
      <div class="topts">
        <button class="tb sel" onclick="sd(2,this)">2 min</button>
        <button class="tb" onclick="sd(5,this)">5 min</button>
        <button class="tb" onclick="sd(10,this)">10 min</button>
        <button class="tb" onclick="sd(15,this)">15 min</button>
      </div>
      <div class="crow">
        <span>Custom:</span>
        <input type="number" id="cm" min="1" max="120" placeholder="—" oninput="cd2(this)">
        <span>minutes</span>
      </div>
      <button class="btn-gen" onclick="genQR()">⚡ Generate QR Code</button>
    </div>
    <div class="qrd" id="qrd">
      <div id="qr-box"></div>
      <div class="cdw">
        <svg class="cdr" viewBox="0 0 72 72" width="76" height="76">
          <circle class="rbg" cx="36" cy="36" r="32"/>
          <circle class="rfg" id="rfg" cx="36" cy="36" r="32"/>
        </svg>
        <div class="cdt"><span class="cdn" id="cdn">--</span><span class="cds" id="cds">sec</span></div>
      </div>
      <div class="expb" id="expb">⏰ QR Expired — Class has ended</div>
    </div>
    <div class="mbtns">
      <button class="bcl" onclick="closeQR()">Close</button>
    </div>
  </div>
</div>

<script>
// Global timer/state vars
let selDur = 2, cdTimer = null, curSessKey = null, curClassId = null;
const CIRC = 201;

function sd(m, btn) {
  selDur = m;
  document.querySelectorAll('.tb').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('cm').value = '';
}
function cd2(inp) {
  const v = parseInt(inp.value);
  if (v > 0) { selDur = v; document.querySelectorAll('.tb').forEach(b => b.classList.remove('sel')); }
}

function showTab(id, btn) {
  document.querySelectorAll('.ct-table').forEach(e => e.style.display = 'none');
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).style.display = 'block';
  btn.classList.add('active');
}

function closeQR() {
  clearInterval(cdTimer);
  document.getElementById('qr-mo').classList.remove('open');
}

function startCountdown(totalSecs, sessKey, onExpire) {
  clearInterval(cdTimer);
  let rem = totalSecs;
  const ring = document.getElementById('rfg');
  const numEl = document.getElementById('cdn');
  const sufEl = document.getElementById('cds');
  function tick() {
    if (rem <= 0) {
      clearInterval(cdTimer);
      numEl.textContent = '0'; sufEl.textContent = 'sec';
      ring.style.stroke = '#ff6b6b';
      ring.style.strokeDashoffset = CIRC;
      document.getElementById('expb').style.display = 'block';
      if (onExpire) onExpire(sessKey);
      return;
    }
    const m = Math.floor(rem / 60), s = rem % 60;
    numEl.textContent = m > 0 ? `${m}:${s.toString().padStart(2, '0')}` : s;
    sufEl.textContent = m > 0 ? 'min' : 'sec';
    const p = rem / totalSecs;
    ring.style.strokeDashoffset = CIRC * (1 - p);
    ring.style.stroke = p > .5 ? '#00e5b4' : p > .25 ? '#ffb547' : '#ff6b6b';
    rem--;
  }
  tick();
  cdTimer = setInterval(tick, 1000);
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import { getDatabase, ref, get, set, push, update } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";
import { firebaseConfig, SITE_URL } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let me = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = 'login.html';
  const snap = await get(ref(db, `users/${user.uid}`));
  if (!snap.exists() || snap.val().role !== 'faculty') return location.href = 'login.html';
  me = { uid: user.uid, ...snap.val() };
  document.getElementById('nav-name').textContent = me.name;
  document.getElementById('dsub').textContent = `Welcome back, ${me.name}`;
  document.getElementById('lov').style.display = 'none';
  loadClasses();
});

document.getElementById('lout').onclick = async (e) => { e.preventDefault(); await signOut(auth); location.href = 'login.html'; };

// ── LOAD CLASSES ─────────────────────────────────────
async function loadClasses() {
  const [clsSnap, sessSnap, attSnap, enrollSnap] = await Promise.all([
    get(ref(db, 'classes')),
    get(ref(db, 'sessions')),
    get(ref(db, 'attendance')),
    get(ref(db, 'enrollments'))
  ]);

  const allClasses = clsSnap.exists() ? clsSnap.val() : {};
  const sessions = sessSnap.exists() ? Object.entries(sessSnap.val()) : [];
  const attendance = attSnap.exists() ? Object.values(attSnap.val()) : [];
  const enrollments = enrollSnap.exists() ? Object.values(enrollSnap.val()) : [];

  const classes = Object.entries(allClasses)
    .filter(([, c]) => c.facultyId === me.uid)
    .map(([id, c]) => ({ id, ...c }));

  document.getElementById('sc').textContent = classes.length;
  document.getElementById('cc-badge').textContent = `${classes.length} classes`;

  if (!classes.length) {
    document.getElementById('cg').innerHTML = '<div class="es">No classes assigned yet. Ask admin to create classes for you.</div>';
    return;
  }

  let totalStudents = 0, totalPct = 0;
  const data = classes.map(cls => {
    const clsSess = sessions.filter(([, s]) => s.classId === cls.id);
    const clsEnroll = enrollments.filter(e => e.classId === cls.id);
    const clsAtt = attendance.filter(a => a.classId === cls.id);
    const maxP = clsSess.length * clsEnroll.length;
    const pct = maxP > 0 ? Math.round(clsAtt.length / maxP * 100) : 0;
    totalStudents += clsEnroll.length;
    totalPct += pct;

    // Class is ongoing if classActive=true in DB (independent of QR)
    const isClassActive = cls.classActive === true;
    // Find active QR session
    const activeSess = clsSess.find(([, s]) => s.active && new Date() < new Date(s.expiresAt));
    return { cls, sessions: clsSess, students: clsEnroll, attCount: clsAtt.length, pct, activeSess, isClassActive };
  });

  document.getElementById('ss').textContent = totalStudents;
  document.getElementById('sa').textContent = classes.length ? Math.round(totalPct / classes.length) + '%' : '0%';

  // RENDER CARDS
  document.getElementById('cg').innerHTML = data.map(({ cls, students, sessions: s, attCount, pct, activeSess }) => {
    const absent = Math.max(0, s.length * students.length - attCount);
    const pc = pct >= 75 ? 'h' : pct >= 50 ? 'm' : 'l';
    const pf = pct >= 75 ? 'fg' : pct >= 50 ? 'fy' : 'fr';
    const isOngoing = isClassActive;
    const hasActiveQR = !!activeSess;
    return `<div class="cc ${isOngoing ? 'active-class' : ''}" id="card-${cls.id}">
      <div class="ct">
        <div><div class="cn">${cls.name}</div><div class="cs">${cls.subject}</div></div>
        <div class="pp ${pc}">${pct}%</div>
      </div>
      <div class="class-status ${isOngoing ? 'ongoing' : 'ended'}">
        <span class="status-dot ${isOngoing ? 'blink' : ''}"></span>
        ${isOngoing ? 'Class In Progress' : 'Class Ended'}
      </div>
      <div class="chart-row">
        <div class="cw"><canvas id="pie-${cls.id}" width="80" height="80"></canvas></div>
        <div class="leg">
          <div class="li"><div class="ld" style="background:#00e5b4"></div><span class="lv">${attCount}</span><span class="ll">Present</span></div>
          <div class="li"><div class="ld" style="background:#ff6b6b"></div><span class="lv">${absent}</span><span class="ll">Absent</span></div>
          <div class="ldiv">${s.length} sessions · ${students.length} students</div>
        </div>
      </div>
      <div class="pb"><div class="pf ${pf}" style="width:${pct}%"></div></div>
      <div class="btn-row" id="btnrow-${cls.id}">
        ${!isOngoing
          ? `<button class="btn-start btn-full" onclick="startClass('${cls.id}','${cls.name}','${cls.subject}')">▶ Start Class</button>`
          : hasActiveQR
            ? `<button class="btn-qr btn-full" onclick="startClass('${cls.id}','${cls.name}','${cls.subject}')">🔄 Generate New QR</button>
               <button class="btn-end-class btn-full" style="display:block" onclick="endClassNow('${cls.id}')">⛔ End Class</button>`
            : `<button class="btn-qr btn-full" onclick="startClass('${cls.id}','${cls.name}','${cls.subject}')">📱 Generate QR for Late Students</button>
               <button class="btn-end-class btn-full" style="display:block" onclick="endClassNow('${cls.id}')">⛔ End Class</button>`
        }
      </div>
    </div>`;
  }).join('');

  // Pie charts
  data.forEach(({ cls, students, sessions: s, attCount }) => {
    const canvas = document.getElementById('pie-' + cls.id);
    if (!canvas) return;
    const total = s.length * students.length;
    new Chart(canvas, {
      type: 'doughnut',
      data: { datasets: [{ data: total > 0 ? [attCount, Math.max(0, total - attCount)] : [1, 0], backgroundColor: ['#00e5b4', '#ff6b6b'], borderColor: '#0d1526', borderWidth: 3 }] },
      options: { cutout: '65%', plugins: { legend: { display: false }, tooltip: { enabled: total > 0 } }, animation: { duration: 800 } }
    });
  });

  // Tabs & student table
  document.getElementById('tabs').innerHTML = data.map(({ cls }, i) =>
    `<button class="tab${i === 0 ? ' active' : ''}" onclick="showTab('${cls.id}',this)">${cls.name}</button>`).join('');
  document.getElementById('tbd').innerHTML = data.map(({ cls, students, sessions: s }, i) => {
    const rows = students.length ? students.map(e => {
      const stuAtt = attendance.filter(a => a.classId === cls.id && a.studentId === e.studentId);
      const p = stuAtt.length, tot = s.length;
      const pct2 = tot > 0 ? Math.round(p / tot * 100) : 0;
      const pc = pct2 >= 75 ? 'h' : pct2 >= 50 ? 'm' : 'l';
      const col = pct2 >= 75 ? '#00e5b4' : pct2 >= 50 ? '#ffb547' : '#ff6b6b';
      return `<tr><td>${e.studentName || '—'}</td><td><span class="rn">${e.rollNo || '—'}</span></td>
        <td>${p}/${tot}</td>
        <td><span class="ap ${pc}">${pct2}%</span><div class="mb"><div class="mf" style="width:${pct2}%;background:${col}"></div></div></td></tr>`;
    }).join('') : '<tr><td colspan="4" class="es">No students enrolled</td></tr>';
    return `<div id="tab-${cls.id}" class="ct-table" ${i > 0 ? 'style="display:none"' : ''}>
      <table><thead><tr><th>Student</th><th>Roll No.</th><th>Present</th><th>Attendance</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }).join('');
}

// ── START CLASS ───────────────────────────────────────
window.startClass = async (classId, name, subject) => {
  window.curClassId = classId;
  // Mark class as active in DB
  await update(ref(db, `classes/${classId}`), { classActive: true });
  document.getElementById('qr-title').textContent = `${name} — ${subject}`;
  document.getElementById('qr-sub').textContent = 'Set QR duration for attendance';
  document.getElementById('ts').style.display = 'block';
  document.getElementById('qrd').style.display = 'none';
  document.getElementById('expb').style.display = 'none';
  document.getElementById('qr-box').innerHTML = '';
  document.getElementById('qr-mo').classList.add('open');
  // Update card to show ongoing state immediately
  const card = document.getElementById('card-' + classId);
  if (card) {
    card.classList.add('active-class');
    const statusEl = card.querySelector('.class-status');
    if (statusEl) { statusEl.className = 'class-status ongoing'; statusEl.innerHTML = '<span class="status-dot blink"></span>Class In Progress'; }
  }
};

// ── OPEN QR (already running class) ──────────────────
window.openQR = (classId, name, subject) => {
  document.getElementById('qr-title').textContent = `${name} — ${subject}`;
  document.getElementById('qr-sub').textContent = 'Show this QR to students';
  document.getElementById('ts').style.display = 'none';
  document.getElementById('qrd').style.display = 'block';
  document.getElementById('qr-mo').classList.add('open');
  // Regenerate QR for current session
  if (window.curSessToken) {
    const scanUrl = `${SITE_URL}/scan.html?token=${window.curSessToken}`;
    document.getElementById('qr-box').innerHTML = '';
    new QRCode(document.getElementById('qr-box'), { text: scanUrl, width: 180, height: 180, colorDark: '#000', colorLight: '#fff' });
  }
};

// ── GENERATE QR ───────────────────────────────────────
window.genQR = async () => {
  document.getElementById('qr-sub').textContent = 'Generating…';
  const classId = window.curClassId;

  // Deactivate old sessions
  const snap = await get(ref(db, 'sessions'));
  if (snap.exists()) {
    const updates = {};
    Object.entries(snap.val()).forEach(([k, v]) => { if (v.classId === classId && v.active) updates[`sessions/${k}/active`] = false; });
    if (Object.keys(updates).length) await update(ref(db), updates);
  }

  const token = crypto.randomUUID();
  const expiresAt = new Date(Date.now() + selDur * 60000).toISOString();
  const newRef = push(ref(db, 'sessions'));
  await set(newRef, { classId, token, active: true, expiresAt, date: new Date().toLocaleDateString('en-IN'), createdAt: new Date().toISOString() });

  window.curSessKey = newRef.key;
  window.curSessToken = token;

  const scanUrl = `${SITE_URL}/scan.html?token=${token}`;
  document.getElementById('ts').style.display = 'none';
  document.getElementById('qrd').style.display = 'block';
  document.getElementById('qr-sub').textContent = `Active for ${selDur} min — show to students`;
  document.getElementById('qr-box').innerHTML = '';
  new QRCode(document.getElementById('qr-box'), { text: scanUrl, width: 180, height: 180, colorDark: '#000', colorLight: '#fff' });

  // Update card to show "ongoing" state
  updateCardState(classId, true, newRef.key);

  startCountdown(selDur * 60, newRef.key, onQRExpired);
};

// ── WHEN QR EXPIRES → END CLASS ───────────────────────
async function onQRExpired(sessKey) {
  await update(ref(db, `sessions/${sessKey}`), { active: false });
  const classId = window.curClassId;
  // Class stays ongoing — just update card buttons after 2s
  setTimeout(() => {
    closeQR();
    // Update card buttons: class ongoing but no active QR
    const card = document.getElementById('card-' + classId);
    if (card) {
      const btnRow = card.querySelector('.btn-row') || document.getElementById('btnrow-' + classId);
      const cn = card.querySelector('.cn').textContent;
      const cs = card.querySelector('.cs').textContent;
      if (btnRow) {
        btnRow.innerHTML = `
          <button class="btn-qr btn-full" onclick="startClass('${classId}','${cn}','${cs}')">📱 Generate QR for Late Students</button>
          <button class="btn-end-class btn-full" style="display:block" onclick="endClassNow('${classId}')">⛔ End Class</button>`;
      }
      const statusEl = card.querySelector('.class-status');
      if (statusEl) { statusEl.className = 'class-status ongoing'; statusEl.innerHTML = '<span class="status-dot blink"></span>Class In Progress — QR Expired'; }
    }
  }, 2000);
}

// ── END CLASS MANUALLY ────────────────────────────────
window.endClassNow = async (classId) => {
  if (!confirm('End this class now?')) return;
  clearInterval(cdTimer);
  // Mark class as ended in DB
  await update(ref(db, `classes/${classId}`), { classActive: false });
  // Also deactivate any running QR sessions for this class
  const snap = await get(ref(db, 'sessions'));
  if (snap.exists()) {
    const updates = {};
    Object.entries(snap.val()).forEach(([k, v]) => {
      if (v.classId === classId && v.active) updates[`sessions/${k}/active`] = false;
    });
    if (Object.keys(updates).length) await update(ref(db), updates);
  }
  closeQR();
  loadClasses();
};

// Update card buttons/status without full reload
function updateCardState(classId, isOngoing, sessKey) {
  const card = document.getElementById('card-' + classId);
  if (!card) return;
  const statusEl = card.querySelector('.class-status');
  const btnRow = card.querySelector('.btn-row');
  if (statusEl) {
    statusEl.className = `class-status ${isOngoing ? 'ongoing' : 'ended'}`;
    statusEl.innerHTML = `<span class="status-dot ${isOngoing ? 'blink' : ''}"></span>${isOngoing ? 'Class In Progress' : 'Class Ended'}`;
  }
  if (btnRow && !isOngoing) {
    // Get class name/subject from card
    const cn = card.querySelector('.cn').textContent;
    const cs = card.querySelector('.cs').textContent;
    btnRow.innerHTML = `<button class="btn-start btn-full" onclick="startClass('${classId}','${cn}','${cs}')">▶ Start Class</button>`;
  }
}


document.getElementById('qr-mo').addEventListener('click', e => { if (e.target.id === 'qr-mo') closeQR(); });
</script>
