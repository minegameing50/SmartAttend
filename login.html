<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/jpeg" href="static/logo.jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060a14;--panel:#0d1526;--border:#162035;--accent:#00e5b4;--accent2:#3d8eff;--text:#edf2ff;--muted:#5c7499;--muted2:#8ba3c7;--danger:#ff6b6b}
html,body{min-height:100vh}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(0,229,180,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,180,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(0,229,180,.1),transparent 70%);top:-150px;left:-150px}
.orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(61,142,255,.08),transparent 70%);bottom:-100px;right:-100px}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;margin:0 auto;padding:40px 20px 60px;animation:fadeUp .6s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.brand{text-align:center;margin-bottom:36px}
.brand img{width:68px;height:68px;border-radius:16px;background:#111;padding:6px;object-fit:contain;margin:0 auto 14px;display:block;box-shadow:0 0 30px rgba(0,229,180,.2)}
.brand h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand p{color:var(--muted2);font-size:.875rem;margin-top:6px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px}
.card h2{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:700;margin-bottom:26px}
.form-group{margin-bottom:16px}
label{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;font-weight:500}
input{width:100%;background:#0a1020;border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,180,.1)}

/* PASSWORD WRAP */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:48px}
.eye-btn{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:4px;
  color:var(--muted);transition:color .2s;display:flex;align-items:center;
}
.eye-btn:hover{color:var(--accent)}
.eye-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#060a14;font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:6px;transition:opacity .2s,transform .1s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.error{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:#ff8a8a;border-radius:10px;padding:11px 16px;font-size:.85rem;margin-bottom:16px;display:none}
.role-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.role-tab{padding:9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted2);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s;text-align:center}
.role-tab.active{border-color:var(--accent);color:var(--accent);background:rgba(0,229,180,.08)}
.switch-link{text-align:center;margin-top:18px;font-size:.82rem;color:var(--muted)}
.switch-link a{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}
.loading{display:inline-block;width:14px;height:14px;border:2px solid rgba(6,10,20,.4);border-top-color:#060a14;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrap">
  <div class="brand">
    <img src="static/logo.jpeg" alt="SmartAttend">
    <h1>SmartAttend</h1>
    <p>Intelligent Attendance Management</p>
  </div>
  <div class="card">
    <h2 id="form-title">Sign in to continue</h2>
    <div class="error" id="error"></div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="l-email" placeholder="you@college.in" autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="l-pass" placeholder="••••••••">
          <button class="eye-btn" id="eye-l" type="button" aria-label="Show password">
            <!-- EYE OPEN -->
            <svg id="eye-l-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <!-- EYE CLOSED (hidden) -->
            <svg id="eye-l-closed" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button class="btn" id="login-btn">Sign In →</button>
      <div class="switch-link">New user? <a id="to-register">Create account</a></div>
    </div>

    <!-- REGISTER FORM -->
    <div id="reg-form" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="r-name" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Roll No. <span style="color:var(--muted)">(students only)</span></label>
        <input type="text" id="r-roll" placeholder="e.g. 2026CS001">
      </div>
      <div class="form-group">
        <label>Role</label>
        <div class="role-tabs" id="role-tabs">
          <button class="role-tab active" id="role-student">Student</button>
          <button class="role-tab" id="role-faculty">Faculty</button>
          <button class="role-tab" id="role-admin">Admin</button>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <div id="role-indicator" style="font-size:.78rem;color:var(--accent);background:rgba(0,229,180,.08);border:1px solid rgba(0,229,180,.2);border-radius:7px;padding:7px 12px;margin-bottom:16px;display:none;">✓ Registering as: <strong id="role-label">Student</strong></div>
        <input type="email" id="r-email" placeholder="you@college.in">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="r-pass" placeholder="Min 6 characters">
          <button class="eye-btn" id="eye-r" type="button" aria-label="Show password">
            <svg id="eye-r-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-r-closed" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button class="btn" id="reg-btn">Create Account</button>
      <div class="switch-link">Already have an account? <a id="to-login">Sign in</a></div>
    </div>
  </div>
</div>

<!-- Non-module script for DOM interactions (runs globally) -->
<script>
function togglePassword(inputId, openId, closedId) {
  const input = document.getElementById(inputId);
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  document.getElementById(openId).style.display = isHidden ? 'none' : 'block';
  document.getElementById(closedId).style.display = isHidden ? 'block' : 'none';
}

document.getElementById('eye-l').addEventListener('click', function() {
  togglePassword('l-pass', 'eye-l-open', 'eye-l-closed');
});
document.getElementById('eye-r').addEventListener('click', function() {
  togglePassword('r-pass', 'eye-r-open', 'eye-r-closed');
});

let isRegMode = false;
window.selectedRole = "student"; // store on window so module script can read it

document.getElementById('to-register').addEventListener('click', function() {
  isRegMode = true;
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('reg-form').style.display = 'block';
  document.getElementById('form-title').textContent = 'Create account';
  document.getElementById('error').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('to-login').addEventListener('click', function() {
  isRegMode = false;
  document.getElementById('reg-form').style.display = 'none';
  document.getElementById('login-form').style.display = 'block';
  document.getElementById('form-title').textContent = 'Sign in to continue';
  document.getElementById('error').style.display = 'none';
});

// Role tabs
['student','faculty','admin'].forEach(role => {
  document.getElementById('role-' + role).addEventListener('click', function() {
    window.selectedRole = role; // update window so module script sees it
    document.getElementById('role-indicator').style.display = 'block';
    document.getElementById('role-label').textContent = role.charAt(0).toUpperCase() + role.slice(1);
    document.querySelectorAll('.role-tab').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') isRegMode ? doRegister() : doLogin();
});
</script>

<!-- Module script for Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import { getDatabase, ref, set, get }
  from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  const snap = await get(ref(db, `users/${user.uid}`));
  if (snap.exists()) redirect(snap.val().role);
});

function redirect(role) {
  const pages = { faculty: 'faculty.html', student: 'student.html', admin: 'admin.html' };
  window.location.href = pages[role] || 'student.html';
}

function showErr(msg) {
  const el = document.getElementById('error');
  el.textContent = msg; el.style.display = 'block';
}
function hideErr() { document.getElementById('error').style.display = 'none'; }

// Expose to global scope so non-module keydown + button clicks work
window.doLogin = async () => {
  hideErr();
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (!email || !pass) return showErr('Please fill in all fields.');
  const btn = document.getElementById('login-btn');
  btn.innerHTML = '<span class="loading"></span>Signing in…'; btn.disabled = true;
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const snap = await get(ref(db, `users/${cred.user.uid}`));
    if (snap.exists()) redirect(snap.val().role);
    else showErr('User profile not found. Try registering again.');
  } catch(e) {
    showErr(e.code === 'auth/invalid-credential' ? 'Wrong email or password.' : e.message);
  }
  btn.innerHTML = 'Sign In →'; btn.disabled = false;
};

window.doRegister = async () => {
  hideErr();
  const name = document.getElementById('r-name').value.trim();
  const roll = document.getElementById('r-roll').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass = document.getElementById('r-pass').value;
  if (!name || !email || !pass) return showErr('Please fill in all required fields.');
  if (pass.length < 6) return showErr('Password must be at least 6 characters.');
  const btn = document.getElementById('reg-btn');
  btn.innerHTML = '<span class="loading"></span>Creating…'; btn.disabled = true;
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await set(ref(db, `users/${cred.user.uid}`), {
      name, email, role: window.selectedRole || 'student',
      rollNo: roll, createdAt: new Date().toISOString()
    });
    redirect(window.selectedRole || 'student');
  } catch(e) {
    showErr(e.code === 'auth/email-already-in-use' ? 'Email already registered.' : e.message);
  }
  btn.innerHTML = 'Create Account'; btn.disabled = false;
};

document.getElementById('login-btn').addEventListener('click', window.doLogin);
document.getElementById('reg-btn').addEventListener('click', window.doRegister);
</script>
</body>
</html>
