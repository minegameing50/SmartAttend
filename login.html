<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/jpeg" href="static/logo.jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060a14;--panel:#0d1526;--border:#162035;--accent:#00e5b4;--accent2:#3d8eff;--text:#edf2ff;--muted:#5c7499;--muted2:#8ba3c7;--danger:#ff6b6b}

/* KEY FIX: no flex on body, no overflow hidden anywhere */
html, body { min-height:100vh; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
}

.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(0,229,180,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,180,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(0,229,180,.1),transparent 70%);top:-150px;left:-150px}
.orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(61,142,255,.08),transparent 70%);bottom:-100px;right:-100px}

/* WRAP: centered with margin auto, scrolls naturally */
.wrap{
  position:relative;
  z-index:1;
  width:100%;
  max-width:420px;
  margin:0 auto;
  padding:40px 20px 60px;
  animation:fadeUp .6s ease both;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.brand{text-align:center;margin-bottom:36px}
.brand img{width:68px;height:68px;border-radius:16px;background:#fff;padding:6px;object-fit:contain;margin-bottom:14px;box-shadow:0 0 30px rgba(0,229,180,.2);display:block;margin-left:auto;margin-right:auto}
.brand h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand p{color:var(--muted2);font-size:.875rem;margin-top:6px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px}
.card h2{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:700;margin-bottom:26px}
.form-group{margin-bottom:16px}
label{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;font-weight:500}
input{width:100%;background:#0a1020;border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,180,.1)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1;padding:0;transition:color .2s}
.eye:hover{color:var(--accent)}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#060a14;font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:6px;transition:opacity .2s,transform .1s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.error{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:#ff8a8a;border-radius:10px;padding:11px 16px;font-size:.85rem;margin-bottom:16px;display:none}
.role-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.role-tab{padding:9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted2);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s;text-align:center}
.role-tab.active{border-color:var(--accent);color:var(--accent);background:rgba(0,229,180,.08)}
.switch-link{text-align:center;margin-top:18px;font-size:.82rem;color:var(--muted)}
.switch-link a{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}
.loading{display:inline-block;width:14px;height:14px;border:2px solid rgba(6,10,20,.4);border-top-color:#060a14;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrap">
  <div class="brand">
    <img src="static/logo.jpeg" alt="SmartAttend">
    <h1>SmartAttend</h1>
    <p>Intelligent Attendance Management</p>
  </div>
  <div class="card">
    <h2 id="form-title">Sign in to continue</h2>
    <div class="error" id="error"></div>

    <!-- LOGIN -->
    <div id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="l-email" placeholder="you@college.in" autofocus></div>
      <div class="form-group"><label>Password</label><div class="pw-wrap"><input type="password" id="l-pass" placeholder="••••••••"><button class="eye" type="button" onclick="togglePw('l-pass',this)">👁️</button></div></div>
      <button class="btn" id="login-btn" onclick="doLogin()">Sign In →</button>
      <div class="switch-link">New user? <a onclick="toggle()">Create account</a></div>
    </div>

    <!-- REGISTER -->
    <div id="reg-form" style="display:none">
      <div class="form-group"><label>Full Name</label><input type="text" id="r-name" placeholder="Your full name"></div>
      <div class="form-group"><label>Roll No. (students only)</label><input type="text" id="r-roll" placeholder="e.g. 2026CS001"></div>
      <div class="form-group">
        <label>Role</label>
        <div class="role-tabs">
          <button class="role-tab active" onclick="setRole('student',this)">Student</button>
          <button class="role-tab" onclick="setRole('faculty',this)">Faculty</button>
          <button class="role-tab" onclick="setRole('admin',this)">Admin</button>
        </div>
      </div>
      <div class="form-group"><label>Email</label><input type="email" id="r-email" placeholder="you@college.in"></div>
      <div class="form-group"><label>Password</label><div class="pw-wrap"><input type="password" id="r-pass" placeholder="Min 6 characters"><button class="eye" type="button" onclick="togglePw('r-pass',this)">👁️</button></div></div>
      <button class="btn" id="reg-btn" onclick="doRegister()">Create Account</button>
      <div class="switch-link">Already have an account? <a onclick="toggle()">Sign in</a></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import { getDatabase, ref, set, get }
  from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let selectedRole = 'student';
let isRegMode = false;

onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  const snap = await get(ref(db, `users/${user.uid}`));
  if (snap.exists()) redirect(snap.val().role);
});

function redirect(role) {
  const pages = { faculty: 'faculty.html', student: 'student.html', admin: 'admin.html' };
  window.location.href = pages[role] || 'student.html';
}

function showErr(msg) {
  const el = document.getElementById('error');
  el.textContent = msg; el.style.display = 'block';
}
function hideErr() { document.getElementById('error').style.display = 'none'; }

window.setRole = (role, btn) => {
  selectedRole = role;
  document.querySelectorAll('.role-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
};

window.toggle = () => {
  isRegMode = !isRegMode;
  document.getElementById('login-form').style.display = isRegMode ? 'none' : 'block';
  document.getElementById('reg-form').style.display = isRegMode ? 'block' : 'none';
  document.getElementById('form-title').textContent = isRegMode ? 'Create account' : 'Sign in to continue';
  hideErr();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.doLogin = async () => {
  hideErr();
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (!email || !pass) return showErr('Please fill in all fields.');
  const btn = document.getElementById('login-btn');
  btn.innerHTML = '<span class="loading"></span>Signing in…'; btn.disabled = true;
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const snap = await get(ref(db, `users/${cred.user.uid}`));
    if (snap.exists()) redirect(snap.val().role);
    else showErr('User profile not found. Try registering again.');
  } catch(e) {
    showErr(e.code === 'auth/invalid-credential' ? 'Wrong email or password.' : e.message);
  }
  btn.innerHTML = 'Sign In →'; btn.disabled = false;
};

window.doRegister = async () => {
  hideErr();
  const name = document.getElementById('r-name').value.trim();
  const roll = document.getElementById('r-roll').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass = document.getElementById('r-pass').value;
  if (!name || !email || !pass) return showErr('Please fill in all required fields.');
  if (pass.length < 6) return showErr('Password must be at least 6 characters.');
  const btn = document.getElementById('reg-btn');
  btn.innerHTML = '<span class="loading"></span>Creating…'; btn.disabled = true;
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await set(ref(db, `users/${cred.user.uid}`), {
      name, email, role: selectedRole, rollNo: roll,
      createdAt: new Date().toISOString()
    });
    redirect(selectedRole);
  } catch(e) {
    showErr(e.code === 'auth/email-already-in-use' ? 'Email already registered.' : e.message);
  }
  btn.innerHTML = 'Create Account'; btn.disabled = false;
};

window.togglePw = (id, btn) => {
  const inp = document.getElementById(id);
  const show = inp.type === "password";
  inp.type = show ? "text" : "password";
  btn.textContent = show ? "🙈" : "👁️";
};

document.addEventListener
  if (e.key === 'Enter') isRegMode ? window.doRegister() : window.doLogin();
});
</script>
</body>
</html>
