<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/jpeg" href="static/logo.jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060a14;--panel:#0d1526;--panel2:#0a1020;--border:#162035;--accent:#00e5b4;--accent2:#3d8eff;--warn:#ffb547;--danger:#ff6b6b;--text:#edf2ff;--muted:#5c7499;--muted2:#8ba3c7}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
nav{position:sticky;top:0;z-index:100;background:rgba(6,10,20,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-brand{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-brand img{width:34px;height:34px;border-radius:8px;background:#fff;padding:3px;object-fit:contain}
.btn-out{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:8px;text-decoration:none;font-size:.8rem;transition:.2s}
.btn-out:hover{border-color:var(--danger);color:var(--danger)}
.main{max-width:1100px;margin:0 auto;padding:28px 20px}
h1{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;margin-bottom:6px}
.sub{color:var(--muted2);font-size:.875rem;margin-bottom:28px}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px}
.sc{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 22px}
.sl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.sv{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800}
.cg{color:var(--accent)} .cb{color:var(--accent2)} .cy{color:var(--warn)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.g2{grid-template-columns:1fr}}
.pb{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px}
.ph{padding:16px 20px;border-bottom:1px solid var(--border)}
.ph h2{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700}
table{width:100%;border-collapse:collapse}
th{padding:10px 18px;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:11px 18px;font-size:.84rem;border-bottom:1px solid rgba(22,32,53,.5)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.rp{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.7rem;font-weight:600}
.rp-admin{background:rgba(255,181,71,.1);color:var(--warn)}
.rp-faculty{background:rgba(61,142,255,.1);color:var(--accent2)}
.rp-student{background:rgba(0,229,180,.1);color:var(--accent)}
.es{padding:24px;text-align:center;color:var(--muted);font-size:.85rem}
.lov{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="lov" id="lov"><div class="spin"></div></div>
<nav>
  <div class="nav-brand"><img src="static/logo.jpeg">SmartAttend</div>
  <div style="display:flex;align-items:center;gap:14px">
    <span style="color:var(--muted2);font-size:.875rem">Admin Panel</span>
    <a href="login.html" class="btn-out" id="lout">Sign Out</a>
  </div>
</nav>
<div class="main">
  <h1>Admin Dashboard</h1>
  <p class="sub">Monitor users, classes and attendance across the system.</p>
  <div class="sr">
    <div class="sc"><div class="sl">Total Users</div><div class="sv cb" id="su">—</div></div>
    <div class="sc"><div class="sl">Students</div><div class="sv cg" id="sst">—</div></div>
    <div class="sc"><div class="sl">Faculty</div><div class="sv cy" id="sf">—</div></div>
    <div class="sc"><div class="sl">Classes</div><div class="sv cb" id="scl">—</div></div>
    <div class="sc"><div class="sl">Sessions</div><div class="sv cg" id="sse">—</div></div>
    <div class="sc"><div class="sl">Attendance Records</div><div class="sv cy" id="sat">—</div></div>
  </div>
  <div class="g2">
    <div class="pb">
      <div class="ph"><h2>👥 All Users</h2></div>
      <div style="overflow-x:auto">
        <table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead>
        <tbody id="utb"><tr><td colspan="3" class="es">Loading…</td></tr></tbody></table>
      </div>
    </div>
    <div class="pb">
      <div class="ph"><h2>📚 All Classes</h2></div>
      <div style="overflow-x:auto">
        <table><thead><tr><th>Class</th><th>Subject</th><th>Faculty</th></tr></thead>
        <tbody id="ctb"><tr><td colspan="3" class="es">Loading…</td></tr></tbody></table>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href='login.html';
  const snap = await get(ref(db,`users/${user.uid}`));
  if (!snap.exists() || snap.val().role !== 'admin') return location.href='login.html';
  document.getElementById('lov').style.display='none';
  loadData();
});

document.getElementById('lout').onclick = async (e) => { e.preventDefault(); await signOut(auth); location.href='login.html'; };

async function loadData() {
  const [uSnap,cSnap,sSnap,aSnap] = await Promise.all([
    get(ref(db,'users')), get(ref(db,'classes')), get(ref(db,'sessions')), get(ref(db,'attendance'))
  ]);
  const users = uSnap.exists() ? Object.values(uSnap.val()) : [];
  const classes = cSnap.exists() ? Object.entries(cSnap.val()) : [];
  const students = users.filter(u=>u.role==='student');
  const faculty = users.filter(u=>u.role==='faculty');

  document.getElementById('su').textContent = users.length;
  document.getElementById('sst').textContent = students.length;
  document.getElementById('sf').textContent = faculty.length;
  document.getElementById('scl').textContent = classes.length;
  document.getElementById('sse').textContent = sSnap.exists() ? Object.keys(sSnap.val()).length : 0;
  document.getElementById('sat').textContent = aSnap.exists() ? Object.keys(aSnap.val()).length : 0;

  document.getElementById('utb').innerHTML = users.length
    ? users.map(u=>`<tr>
        <td style="font-weight:500">${u.name}</td>
        <td style="color:var(--muted2);font-size:.78rem">${u.email}</td>
        <td><span class="rp rp-${u.role}">${u.role}</span></td>
      </tr>`).join('')
    : '<tr><td colspan="3" class="es">No users yet</td></tr>';

  document.getElementById('ctb').innerHTML = classes.length
    ? classes.map(([,c])=>`<tr>
        <td style="font-family:Syne,sans-serif;font-weight:700">${c.name}</td>
        <td style="color:var(--muted2);font-size:.82rem">${c.subject}</td>
        <td style="color:var(--accent2);font-size:.82rem">${c.facultyName||'—'}</td>
      </tr>`).join('')
    : '<tr><td colspan="3" class="es">No classes yet</td></tr>';
}
</script>
</body>
</html>
